name: Azure Infrastructure
on:
  workflow_dispatch:
  push:
    branches: [azure-migration]
    paths: ["infra/azure/**", "azure.yaml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-dev
    permissions:
      id-token: write
      contents: read
    # Note: This workflow runs independently but should only be triggered
    # after CI checks pass on the azure-migration branch

    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        run: curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Infrastructure
        run: azd up --no-prompt --environment azure-dev
