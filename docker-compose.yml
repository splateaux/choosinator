services:
  # Cosmos DB Emulator
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: choosinator-cosmos-emulator
    ports:
      - "8081:8081" # HTTPS gateway
      - "10250:10250" # required
      - "10251:10251" # Internal communication
      - "10252:10252" # Internal communication
      - "10253:10253" # Internal communication
      - "10254:10254" # Internal communication
      - "10255:10255" # required
    environment:
      - ACCEPT_EULA=Y
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
      - AZURE_COSMOS_EMULATOR_DATA_PERSISTENCE_PATH=/data
      - AZURE_COSMOS_EMULATOR_ENABLE_SWAGGER=true
      - AZURE_COSMOS_EMULATOR_IP_ADDRESS_OVERRIDE=127.0.0.1
    volumes:
      - cosmos-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "curl -kfsS https://127.0.0.1:8081/_explorer/index.html > /dev/null",
        ]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s

  # Cosmos DB Initialization (creates database and containers)
  cosmos-init:
    network_mode: host
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: choosinator-cosmos-init
    depends_on:
      cosmos-emulator:
        condition: service_healthy
    volumes:
      - ./cosmos-init:/work
    working_dir: /work
    environment:
      - COSMOS_CONNECTION_STRING=AccountEndpoint=https://localhost:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;
      - DOTNET_CLI_HOME=/work/.dotnet
      - HOME=/work
    command: >
      bash -lc '
        set -e
        dotnet restore &&
        dotnet run --project CosmosInit.csproj
      '

  # Azure Storage Emulator (for Functions runtime)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: choosinator-azurite
    ports:
      - "10000:10000" # Blob service
      - "10001:10001" # Queue service
      - "10002:10002" # Table service
    environment:
      - AZURITE_ACCOUNTS=devstoreaccount1:devstoreaccount1
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('net'),chk=p=>new Promise(r=>{const s=new net.Socket();s.setTimeout(2000).once('error',()=>r(1)).once('timeout',()=>r(1)).connect(p,'127.0.0.1',()=>{s.end();r(0);});});(async()=>{process.exit(await chk(10000)||await chk(10001)||await chk(10002));})();",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Azure SignalR Local Emulator (for real-time messaging)
  signalr-emulator:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: choosinator-signalr-emulator
    working_dir: /work
    volumes:
      - signalr-emulator-data:/work # persist settings.json & logs
    environment:
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - NUGET_XMLDOC_MODE=skip
    command: >
      bash -lc "
        dotnet tool install -g Microsoft.Azure.SignalR.Emulator ||
        dotnet tool update -g Microsoft.Azure.SignalR.Emulator;
        export PATH=$$PATH:/root/.dotnet/tools;
        test -f settings.json || asrs-emulator upstream init;
        asrs-emulator start -p 8080
      "
    ports:
      - "8080:8080"
    healthcheck:
      # TCP-level check: emulator responds on 8080 when running
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && exit 0 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  cosmos-data:
  azurite-data:
  signalr-emulator-data:

networks:
  default:
    name: choosinator-network
